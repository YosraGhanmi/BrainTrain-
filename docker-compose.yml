# BrainTrain on one server: the website and its PostgreSQL database.
# Settings come from the .env file next to this one (see .env.docker.example
# and DEPLOY_VPS.md). Start or update with: docker compose up -d --build

name: braintrain
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published on the internet; only the app container reaches it

  migrate:
    image: ${MIGRATION_IMAGE:-braintrain-migrations:local}
    build:
      context: .
      target: migrations
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    restart: 'no'

  app:
    image: ${IMAGE:-braintrain-app:local}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_STRINGTUNE_DEV_TOKEN: ${NEXT_PUBLIC_STRINGTUNE_DEV_TOKEN:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 6s
      start_period: 40s
      retries: 12
    volumes:
      - uploads:/app/uploads
    # Only reachable from the server itself; Nginx forwards the public traffic
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  db-data:
  uploads:
