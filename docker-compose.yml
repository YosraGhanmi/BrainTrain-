services:
  mysql:
    image: mysql:8.4
    container_name: braintrain_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: braintrain
      MYSQL_USER: braintrain
      MYSQL_PASSWORD: braintrain
      MYSQL_ROOT_PASSWORD: braintrain_root
    ports:
      - '3307:3306'
    volumes:
      - braintrain_mysql_data:/var/lib/mysql

volumes:
  braintrain_mysql_data:
