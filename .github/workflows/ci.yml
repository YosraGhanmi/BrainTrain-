name: VPS CI and deployment
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: braintrain-vps
  cancel-in-progress: false
jobs:
  ci:
    if: vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, braintrain]
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_STRINGTUNE_DEV_TOKEN: ${{ vars.NEXT_PUBLIC_STRINGTUNE_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check configuration
        if: github.ref == 'refs/heads/main'
        run: |
          [[ "$NEXT_PUBLIC_SITE_URL" == https://* && "$NEXT_PUBLIC_SITE_URL" != *localhost* ]]
          test -s /opt/braintrain/.env
      - name: Prepare release
        run: |
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "/opt/braintrain/releases/$release"
          git archive HEAD | tar -x -C "/opt/braintrain/releases/$release"
          echo "RELEASE=/opt/braintrain/releases/$release" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release" >> "$GITHUB_ENV"
      - name: Build and test on VPS
        run: |
          cd "$RELEASE"
          bash scripts/vps/ci.sh "$RELEASE_TAG"
      - name: Deploy main
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$RELEASE"
          bash scripts/vps/deploy.sh "braintrain-app:$RELEASE_TAG"
